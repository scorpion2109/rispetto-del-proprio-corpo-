<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
:root{
 --bg:#2b2b2b;
 --text:#e6f7ff;
 --bar:#3a3a3a;
 --accent:#00eaff;
 --ok:#00ff99;
 --no:#ff4d4d;
}

body{
 margin:0;
 font-family:Poppins,sans-serif;
 background:var(--bg);
 color:var(--text);
}

/* TOPBAR */
.topbar{
 height:70px;
 background:var(--bar);
 display:flex;
 align-items:center;
 justify-content:space-between;
 padding:0 20px;
}

.topbar .left{
 display:flex;
 align-items:center;
}

.logo{
 display:flex;
 align-items:center;
 gap:12px;
 text-decoration:none;
 color:var(--text);
 font-weight:600;
 font-size:18px;
}

.logo img{height:36px}
.logo:hover{opacity:.85}

.avatar{
 width:40px;height:40px;border-radius:50%;
 border:2px solid var(--accent);
 cursor:pointer;
 object-fit:cover;
}

/* PROFILE MENU */
.profile-menu{
 display:none;
 position:fixed;
 top:70px;right:20px;
 width:260px;
 background:var(--bar);
 border:2px solid var(--accent);
 border-radius:14px;
 padding:12px;
 z-index:10;
}
.profile-menu.show{display:block}
.profile-menu div{padding:10px;border-radius:8px;cursor:pointer}
.profile-menu div:hover{background:rgba(0,180,204,.3)}
.profile-menu .email{font-size:13px;opacity:.8;cursor:default}
.profile-menu label{font-size:12px;opacity:.7}
.profile-menu select{
 width:100%;margin-top:4px;padding:6px;
 border-radius:8px;border:1px solid var(--accent);
 background:rgba(255,255,255,.1);color:var(--text)
}
.profile-menu hr{border:1px solid var(--accent);opacity:.3;margin:10px 0}

/* CONTENT */
.container{
 max-width:1200px;
 margin:40px auto;
 padding:20px;
}

.card{
 background:rgba(255,255,255,.06);
 border-radius:18px;
 padding:18px;
 margin-bottom:20px;
 box-shadow:0 10px 30px rgba(0,0,0,.3);
}

.card b{font-size:18px}

.badge{
 padding:4px 10px;border-radius:8px;
 font-size:12px;font-weight:600
}
.badge.pending{background:#ffaa00;color:#000}
.badge.approved{background:var(--ok);color:#000}

/* ANSWERS */
.answers{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
 gap:12px;
 margin:14px 0;
}

.answer{
 background:rgba(0,234,255,.08);
 border:1px solid rgba(0,234,255,.3);
 border-radius:14px;
 padding:12px;
 transition:.2s;
}
.answer:hover{transform:translateY(-3px)}

.answer .q{font-size:13px;opacity:.7}
.answer .a{font-size:16px;font-weight:600;color:var(--accent)}

/* ACTIONS */
.actions button{
 margin-right:10px;padding:8px 14px;
 border:none;border-radius:10px;
 cursor:pointer;font-weight:600;
 transition:.2s;
}
.actions button:hover{transform:scale(1.05)}
.approve{background:var(--ok)}
.delete{background:var(--no)}

canvas{
 width:100%;
 height:320px;
 border-radius:14px;
 background:rgba(0,0,0,.25);
}
</style>
</head>

<body>

<header class="topbar">
 <div class="left">
  <a href="index.html" class="logo">
   <img src="scorpion.png">
   <span id="title">Dashboard</span>
  </a>
 </div>
 <div>
  <img id="avatar" class="avatar" src="avatar-default.png">
  <div id="menu" class="profile-menu"></div>
 </div>
</header>

<div class="container">
 <h2 id="chartsTitle"></h2>
 <div id="charts"></div>

 <h2 id="listTitle"></h2>
 <div id="list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import {
 getFirestore, collection, getDocs,
 doc, getDoc, updateDoc, deleteDoc
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

/* FIREBASE */
const firebaseConfig={
 apiKey:"AIzaSyDyhMkXCr8AEEGggeakUET6xlW9JG92hDQ",
 authDomain:"fisica-rispetto-del-corpo.firebaseapp.com",
 projectId:"fisica-rispetto-del-corpo",
 appId:"1:1018600887176:web:6712b714cb7ec9ca8b203d"
};

const app=initializeApp(firebaseConfig);
const db=getFirestore(app);
const auth=getAuth(app);

/* ELEMENTI */
const avatar=document.getElementById("avatar");
const menu=document.getElementById("menu");
const list=document.getElementById("list");
const charts=document.getElementById("charts");

/* LINGUA */
let lang=localStorage.getItem("lang")||"it";
const tr={
 it:{
  dashboard:"Dashboard",
  charts:"Grafici (solo approvati)",
  list:"Sondaggi",
  logout:"Logout",
  lingua:"Lingua",
  approve:"Approva",
  delete:"Elimina",
  confirmDelete:"Eliminare questo sondaggio?"
 },
 en:{
  dashboard:"Dashboard",
  charts:"Charts (approved only)",
  list:"Surveys",
  logout:"Logout",
  lingua:"Language",
  approve:"Approve",
  delete:"Delete",
  confirmDelete:"Delete this survey?"
 }
};

function applyLang(){
 title.innerText=tr[lang].dashboard;
 chartsTitle.innerText="📈 "+tr[lang].charts;
 listTitle.innerText="📋 "+tr[lang].list;
}

/* MENU HTML */
function menuHTML(email,isLogged){
 if(!isLogged){
  return `
   <div onclick="location.href='login.html'">Login</div>
  `;
 }
 return `
  <div class="email">${email}</div>
  <hr>
  <label>${tr[lang].lingua}</label>
  <select id="langSel">
   <option value="it">IT</option>
   <option value="en">EN</option>
  </select>
  <hr>
  <div onclick="logout()">${tr[lang].logout}</div>
 `;
}

window.logout=()=>signOut(auth).then(()=>location.href="index.html");

/* INIT CONTROLS */
function initControls(){
 const sel=document.getElementById("langSel");
 if(!sel) return;
 sel.value=lang;
 sel.onchange=e=>{
  lang=e.target.value;
  localStorage.setItem("lang",lang);
  location.reload();
 };
}

/* AUTH + AVATAR */
onAuthStateChanged(auth,async user=>{
 if(!user){
  avatar.src="avatar-default.png";
  menu.innerHTML=menuHTML("",false);
  initControls();
  return;
 }

 try{
  const snap=await getDoc(doc(db,"utenti",user.uid));
  if(snap.exists() && snap.data().avatar){
   avatar.src=snap.data().avatar;
  }else if(user.photoURL){
   avatar.src=user.photoURL;
  }else{
   avatar.src="avatar-default.png";
  }
 }catch{
  avatar.src="avatar-default.png";
 }

 menu.innerHTML=menuHTML(user.email,true);
 initControls();
 applyLang();
 loadAll();
});

/* AVATAR MENU */
avatar.onclick=e=>{
 e.stopPropagation();
 menu.classList.toggle("show");
};
document.addEventListener("click",()=>menu.classList.remove("show"));

/* LOAD DASHBOARD */
async function loadAll(){
 const snap=await getDocs(collection(db,"sondaggi"));
 list.innerHTML="";
 charts.innerHTML="";
 let stats={};

 snap.forEach(d=>{
  const s=d.data();

  if(s.stato==="approved"){
   for(const [q,a] of Object.entries(s.risposte)){
    stats[q]=stats[q]||{};
    stats[q][a]=(stats[q][a]||0)+1;
   }
  }

  const div=document.createElement("div");
  div.className="card";
  div.innerHTML=`
   <b>${s.nome||"-"}</b><br>
   <span class="badge ${s.stato}">${s.stato}</span>

   <div class="answers">
    ${Object.entries(s.risposte).map(([q,a])=>`
     <div class="answer">
      <div class="q">${q}</div>
      <div class="a">${a}</div>
     </div>`).join("")}
   </div>

   <div class="actions">
    ${s.stato!=="approved"?`<button class="approve">${tr[lang].approve}</button>`:""}
    <button class="delete">${tr[lang].delete}</button>
   </div>
  `;

  if(s.stato!=="approved")
   div.querySelector(".approve").onclick=()=>approve(d.id);
  div.querySelector(".delete").onclick=()=>del(d.id);

  list.appendChild(div);
 });

 for(const q in stats){
  const card=document.createElement("div");
  card.className="card";
  card.innerHTML=`<b>${q}</b><canvas></canvas>`;
  charts.appendChild(card);
  drawBar(card.querySelector("canvas"),stats[q]);
 }
}

/* GRAFICO */
function drawBar(canvas,data){
 const ctx=canvas.getContext("2d");
 const dpr=window.devicePixelRatio||1;
 const w=canvas.offsetWidth,h=320;
 canvas.width=w*dpr;canvas.height=h*dpr;
 ctx.scale(dpr,dpr);

 const e=Object.entries(data).sort((a,b)=>b[1]-a[1]);
 const max=Math.max(...e.map(x=>x[1]));
 const tot=e.reduce((s,x)=>s+x[1],0);
 const pad=50,gap=20;
 const bw=(w-pad*2)/e.length-gap;

 let p=0;
 (function anim(){
  p+=0.05;ctx.clearRect(0,0,w,h);
  e.forEach(([l,v],i)=>{
   const bh=((v/max)*(h-pad*2))*Math.min(p,1);
   const x=pad+i*(bw+gap),y=h-pad-bh;
   const g=ctx.createLinearGradient(0,y,0,y+bh);
   g.addColorStop(0,"#00eaff");
   g.addColorStop(1,"#007c8a");
   ctx.fillStyle=g;
   ctx.fillRect(x,y,bw,bh);
   ctx.fillStyle="#fff";
   ctx.textAlign="center";
   ctx.fillText(v,x+bw/2,y-8);
   ctx.fillText(Math.round(v/tot*100)+"%",x+bw/2,y+20);
   ctx.save();
   ctx.translate(x+bw/2,h-pad+15);
   ctx.rotate(-0.4);
   ctx.fillText(l,0,0);
   ctx.restore();
  });
  if(p<1)requestAnimationFrame(anim);
 })();
}

async function approve(id){
 await updateDoc(doc(db,"sondaggi",id),{stato:"approved"});
 loadAll();
}
async function del(id){
 if(!confirm(tr[lang].confirmDelete))return;
 await deleteDoc(doc(db,"sondaggi",id));
 loadAll();
}
</script>

</body>
</html>
