<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Staff</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
/* BASE (UGUALE A INDEX) */
html, body {
    margin: 0;
    height: 100%;
    font-family: "Poppins", sans-serif;
    background: #2b2b2b;
    color: #e6f7ff;
}

/* LOGO IN ALTO */
.topbar {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 70px;
    background: #3a3a3a;
    display: flex;
    align-items: center;
    padding: 0 25px;
    z-index: 1000;
}

.logo {
    height: 40px;
    cursor: pointer;
}

/* LOGIN */
.container {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding-top: 70px;
}

.login-box {
    width: 340px;
    background: #3a3a3a;
    padding: 30px;
    border-radius: 16px;
    border: 2px solid #00eaff;
    box-shadow: 0 8px 20px rgba(0,0,0,0.7);
}

.login-box h2 {
    text-align: center;
    margin-bottom: 20px;
    color: #00eaff;
    text-shadow: 0 0 10px #00eaff;
}

.login-box label {
    font-size: 14px;
}

.login-box input {
    width: 100%;
    padding: 11px;
    margin-top: 6px;
    margin-bottom: 14px;
    border-radius: 10px;
    border: none;
    outline: none;
    font-size: 14px;
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #00b5cc;
    border: none;
    border-radius: 12px;
    font-weight: bold;
    font-size: 15px;
    cursor: pointer;
}

.login-box button:hover {
    background: #00eaff;
    color: #00252b;
    box-shadow: 0 0 15px #00eaff;
}

.error {
    display: none;
    margin-top: 12px;
    text-align: center;
    color: #ff6b6b;
    font-size: 14px;
}
</style>
</head>

<body>

<!-- TOP BAR CON LOGO -->
<header class="topbar">
    <a href="index.html">
        <img src="scorpion.logo-removebg-preview.png" class="logo" alt="Home">
    </a>
</header>

<!-- LOGIN -->
<div class="container">
    <div class="login-box">
        <h2>Login Staff</h2>

        <label>Email</label>
        <input type="email" id="email" placeholder="staff@email.it">

        <label>Password</label>
        <input type="password" id="password" placeholder="********">

        <button id="loginBtn">Accedi</button>

        <div class="error" id="errorMsg">Email o password errate</div>
    </div>
</div>

<!-- FIREBASE AUTH -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/9.23.0/firebase-app.js";
import { 
    getAuth, 
    signInWithEmailAndPassword, 
    onAuthStateChanged 
} from "https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyDyhMkXCr8AEEGggeakUET6xlW9JG92hDQ",
  authDomain: "fisica-rispetto-del-corpo.firebaseapp.com",
  projectId: "fisica-rispetto-del-corpo",
  storageBucket: "fisica-rispetto-del-corpo.firebasestorage.app",
  messagingSenderId: "1018600887176",
  appId: "1:1018600887176:web:6712b714cb7ec9ca8b203d",
  measurementId: "G-TL1WZWG9F7"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Se già loggato → torna a index
onAuthStateChanged(auth, (user) => {
    if (user) {
        localStorage.setItem("staffLogged", "true");
        localStorage.setItem("staffEmail", user.email);
        window.location.href = "index.html";
    }
});

// Login
document.getElementById("loginBtn").addEventListener("click", () => {
    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value.trim();
    const error = document.getElementById("errorMsg");

    signInWithEmailAndPassword(auth, email, password)
        .then((cred) => {
            localStorage.setItem("staffLogged", "true");
            localStorage.setItem("staffEmail", cred.user.email);
            window.location.href = "index.html";
        })
        .catch(() => {
            error.style.display = "block";
        });
});
</script>

</body>
</html>
